<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="604" viewBox="0 0 1280 604" role="img" aria-labelledby="title desc"><title id="title">Windows QoL shortcut reference</title><desc id="desc">Fn-C copies, V pastes, X cuts, A selects all, F finds, Z undoes, Y redoes, E opens Finder, S captures the pointer display and Shift-S captures an area. Screenshots copy to the clipboard.</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><rect x="0" y="0" width="1280" height="604" rx="24" fill="#101824"/><text x="54" y="65" font-size="16" fill="#88b6ff" font-weight="650">LESS REACHING. MORE DOING.</text><text x="54" y="120" font-size="42" fill="#f3f6fb" font-weight="650">Familiar shortcuts, with Fn.</text><text x="54" y="159" font-size="21" fill="#aabbd1" font-weight="400">Toggle the shortcut set in Settings → Shortcuts.</text><rect x="46" y="196" width="384" height="326" rx="14" fill="#1a2738" stroke="#354a64"/><text x="70" y="235" font-size="23" fill="#eef4fc" font-weight="650">Everyday editing</text><rect x="448" y="196" width="384" height="326" rx="14" fill="#1a2738" stroke="#354a64"/><text x="472" y="235" font-size="23" fill="#eef4fc" font-weight="650">Find, undo &amp; open</text><rect x="850" y="196" width="384" height="326" rx="14" fill="#1a2738" stroke="#354a64"/><text x="874" y="235" font-size="23" fill="#eef4fc" font-weight="650">Screenshots</text><rect x="70" y="265" width="49" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="81" y="289" font-size="18" fill="#f4f7fc" font-weight="600">Fn</text><text x="129" y="289" font-size="18" fill="#8dabc9" font-weight="400">+</text><rect x="150" y="265" width="38" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="162" y="289" font-size="18" fill="#f4f7fc" font-weight="600">C</text><text x="205" y="289" font-size="18" fill="#e0e9f6" font-weight="400">Copy</text><rect x="70" y="324" width="49" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="81" y="348" font-size="18" fill="#f4f7fc" font-weight="600">Fn</text><text x="129" y="348" font-size="18" fill="#8dabc9" font-weight="400">+</text><rect x="150" y="324" width="38" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="162" y="348" font-size="18" fill="#f4f7fc" font-weight="600">V</text><text x="205" y="348" font-size="18" fill="#e0e9f6" font-weight="400">Paste</text><rect x="70" y="383" width="49" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="81" y="407" font-size="18" fill="#f4f7fc" font-weight="600">Fn</text><text x="129" y="407" font-size="18" fill="#8dabc9" font-weight="400">+</text><rect x="150" y="383" width="38" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="162" y="407" font-size="18" fill="#f4f7fc" font-weight="600">X</text><text x="205" y="407" font-size="18" fill="#e0e9f6" font-weight="400">Cut</text><rect x="70" y="442" width="49" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="81" y="466" font-size="18" fill="#f4f7fc" font-weight="600">Fn</text><text x="129" y="466" font-size="18" fill="#8dabc9" font-weight="400">+</text><rect x="150" y="442" width="38" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="162" y="466" font-size="18" fill="#f4f7fc" font-weight="600">A</text><text x="205" y="466" font-size="18" fill="#e0e9f6" font-weight="400">Select all</text><rect x="472" y="265" width="49" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="483" y="289" font-size="18" fill="#f4f7fc" font-weight="600">Fn</text><text x="531" y="289" font-size="18" fill="#8dabc9" font-weight="400">+</text><rect x="552" y="265" width="38" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="564" y="289" font-size="18" fill="#f4f7fc" font-weight="600">F</text><text x="607" y="289" font-size="18" fill="#e0e9f6" font-weight="400">Find</text><rect x="472" y="324" width="49" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="483" y="348" font-size="18" fill="#f4f7fc" font-weight="600">Fn</text><text x="531" y="348" font-size="18" fill="#8dabc9" font-weight="400">+</text><rect x="552" y="324" width="38" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="564" y="348" font-size="18" fill="#f4f7fc" font-weight="600">Z</text><text x="607" y="348" font-size="18" fill="#e0e9f6" font-weight="400">Undo</text><rect x="472" y="383" width="49" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="483" y="407" font-size="18" fill="#f4f7fc" font-weight="600">Fn</text><text x="531" y="407" font-size="18" fill="#8dabc9" font-weight="400">+</text><rect x="552" y="383" width="38" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="564" y="407" font-size="18" fill="#f4f7fc" font-weight="600">Y</text><text x="607" y="407" font-size="18" fill="#e0e9f6" font-weight="400">Redo</text><rect x="472" y="442" width="49" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="483" y="466" font-size="18" fill="#f4f7fc" font-weight="600">Fn</text><text x="531" y="466" font-size="18" fill="#8dabc9" font-weight="400">+</text><rect x="552" y="442" width="38" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="564" y="466" font-size="18" fill="#f4f7fc" font-weight="600">E</text><text x="607" y="466" font-size="18" fill="#e0e9f6" font-weight="400">New Finder window</text><rect x="874" y="265" width="104" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="889" y="289" font-size="18" fill="#f4f7fc" font-weight="600">Fn + S</text><text x="874" y="329" font-size="20" fill="#e0e9f6" font-weight="550">Capture the display</text><text x="874" y="355" font-size="18" fill="#aabbd1" font-weight="400">under the pointer.</text><rect x="874" y="386" width="181" height="36" rx="7" fill="#2a3c54" stroke="#526a88"/><text x="889" y="410" font-size="18" fill="#f4f7fc" font-weight="600">Fn + Shift + S</text><text x="874" y="450" font-size="20" fill="#e0e9f6" font-weight="550">Select an area.</text><text x="874" y="476" font-size="17" fill="#aabbd1" font-weight="400">Both copy to the clipboard.</text><text x="54" y="562" font-size="18" fill="#aabbd1" font-weight="400">Accessibility required. Screenshots also need screen-capture permission.</text></g></svg>
